ext><rect x="580" y="135" width="340" height="170" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><rect x="40" y="330" width="880" height="96" rx="10" fill="#F1F5F9"/><text x="60" y="362" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#1E293B" font-weight="700" text-anchor="start">FROM ga_sessions AS s, UNNEST(s.hits) AS h</text><text x="60" y="395" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">Ojo: con la coma, las sesiones con el array vacío desaparecen.</text><text x="60" y="415" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="400" text-anchor="start">Usa LEFT JOIN UNNEST(s.hits) AS h si quieres conservarlas.</text></svg>